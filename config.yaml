agent:
  env_file: ".env.local"
  instructions_file: conversify/prompts/llm.txt
  greeting: "Hey! How are you doing today?"
  goodbye: "Goodbye! Have a great day!"
  default_participant_identity: "identity-qfXx"
  use_eou: false                                      # livekit turn detection
  use_background_noise_removal: false                 # uses Krisp BVC noise cancellation
  use_background_audio: false                         # plays office background audio and keyboard typing sound while the agent speaks
  allow_interruptions: True                           # reset tts on user iterruption

stt:
  provider: "moonshine"                   # "moonshine" (active) | "whisper" (legacy, for A/B)
  moonshine:
    model: "moonshine/tiny"               # "moonshine/base" or "moonshine/tiny"
    device: "cpu"                          # informational: moonshine_onnx runs on the onnxruntime CPU provider
    language: "en"                         # Moonshine is English-only; used to tag the transcript
    model_cache_directory: "./models/moonshine"  # points HF_HOME/HF_HUB_CACHE (see MoonshineSTT note)
  whisper:
    model: "small"
    device: "cpu" # Changed from cuda
    compute_type: "int8"  # Changed for CPU
    language: "en"
    model_cache_directory: "./models/whisper"
    warmup_audio: ""

llm:
  base_url: "http://127.0.0.1:8000/v1"
  model: "qwen2.5-multirope-3B"
  api_key: "not-needed"
  temperature: 0.7
  max_tokens: 256
  parallel_tool_calls: false
  tool_choice: "none"

tts:
  provider: "piper"                        # "piper" (active) | "kokoro" (legacy, for A/B)
  piper:
    model: "./models/piper/en_US-amy-medium.onnx"  # .onnx.json config must sit beside it
    model_cache_directory: "./models/piper"
    speaker_id: null                       # only used for multi-speaker voices; amy is single-speaker
    length_scale: 1.0                      # speed control: < 1 faster, > 1 slower (inverse of kokoro speed)
    noise_scale: 0.667
    noise_w: 0.8
  kokoro:
    base_url: "http://localhost:8880/v1"
    voice: "af_bella"
    model: "kokoro"
    speed: 1.0
    api_key: "not-needed"

vad:
  min_speech_duration: 0.20             # Minimum duration (seconds) for speech detection
  min_silence_duration: 0.40            # Minimum silence duration (seconds) to detect end of speech
  prefix_padding_duration: 0.5          # Padding duration (seconds) before detected speech
  max_buffered_speech: 60.0             # Maximum duration (seconds) of buffered speech
  activation_threshold: 0.5             # Threshold for voice activation detection
  force_cpu: false                      # Force VAD to run on CPU instead of GPU
  sample_rate: 16000  

vision:
  use: true
  # Use same model for vision
  model: "qwen2.5-multirope-3B"
  base_url: "http://127.0.0.1:8000/v1"
  api_key: "not-needed"
  video_frame_interval: 1.0  # How often the newest frame is cached for the next vision turn.
                             # This only refreshes a cached reference; it does NOT trigger
                             # inference, so a short interval costs nothing on the board.
  trim_history: true         # On vision turns, send only system prompt + current question + live frame
                             # (drops prior turns so the small VLM re-reads the image instead of repeating past replies)

avatar:
  use: false
  bithuman:
    api_secret: "BITHUMAN_API_SECRET"  # Set in .env.local as BITHUMAN_API_SECRET
    model: "expression"  # Options: 'expression' (dynamic) or 'essence' (predefined)
    avatar_image: "./models/tech_support.jpg"  # Path to avatar image
    # avatar_id: ""  # Alternative: use existing avatar ID from bitHuman console
    # model_path: ""  # Alternative: path to .imx model file

memory:
  use: false
  dir: "./memory"     

embedding:
  vllm_model_name: "mixedbread-ai/mxbai-embed-large-v1"                             

worker:
  job_memory_warn_mb: 900              
  load_threshold: 0.75                   
  job_memory_limit_mb: 2000            

logging:
  level: "DEBUG"                         
  file: "logs/app.log"                